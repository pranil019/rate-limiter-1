version: "3.9"

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  limiter-1:
    build: ./limiter-service
    environment:
      - NODE_ID=limiter-1
      - PORT=4000
      - REDIS_URL=redis://redis:6379
      - BUCKET_CAPACITY=10
      - REFILL_RATE=2
    ports:
      - "4001:4000"
    depends_on:
      - redis

  limiter-2:
    build: ./limiter-service
    environment:
      - NODE_ID=limiter-2
      - PORT=4000
      - REDIS_URL=redis://redis:6379
      - BUCKET_CAPACITY=10
      - REFILL_RATE=2
    ports:
      - "4002:4000"
    depends_on:
      - redis

  backend:
    build: ./backend-mock
    environment:
      - PORT=5000
    ports:
      - "5000:5000"

  gateway:
    build: ./gateway
    environment:
      - PORT=3000
      - BACKEND_URL=http://backend:5000
      - LIMITER_NODES=http://limiter-1:4000,http://limiter-2:4000
    ports:
      - "3000:3000"
    depends_on:
      - limiter-1
      - limiter-2
      - backend
